<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ruchi's Digital Marketing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;700&family=Public+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F3F8; --surface:#FFFFFF; --ink:#1B2040; --muted:#5B6180; --line:#D8DBE8; --tint:#E8EAF4;
  --accent:#E2A300; --accent-soft:#FBF1D2; --go:#17735F; --go-soft:#DDF1EB; --stop:#B4372C; --stop-soft:#F8E1DE; --focus:#3D4BD8;
  --display:"Familjen Grotesk","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Public Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#13162A; --surface:#1C2040; --ink:#ECEEF8; --muted:#A4AAC8; --line:#343A64; --tint:#262B52;
    --accent:#F0B429; --accent-soft:#3D3312; --go:#4CC3A5; --go-soft:#173A33; --stop:#F08A7E; --stop-soft:#43201D; --focus:#9AA5FF;
  }
}
:root[data-theme="dark"]{
  --paper:#13162A; --surface:#1C2040; --ink:#ECEEF8; --muted:#A4AAC8; --line:#343A64; --tint:#262B52;
  --accent:#F0B429; --accent-soft:#3D3312; --go:#4CC3A5; --go-soft:#173A33; --stop:#F08A7E; --stop-soft:#43201D; --focus:#9AA5FF;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font:400 1rem/1.5 var(--body);-webkit-text-size-adjust:100%}
h1,h2,h3,h4{font-family:var(--display);font-weight:700;line-height:1.15;margin:0}
h1{font-size:1.6rem;letter-spacing:-.01em}
h2{font-size:1.3rem;margin-bottom:.6rem}
h3{font-size:1.08rem}
h4{font-size:1rem;margin:1rem 0 .3rem}
p{margin:.4rem 0}
.wrap{max-width:60rem;margin:0 auto;padding:0 1rem}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.875rem}

.top{padding:1.1rem 0 .8rem}
.top-row{display:flex;gap:.75rem;align-items:baseline;justify-content:space-between;flex-wrap:wrap}
.dry{font-size:.875rem;background:var(--accent-soft);border:1px solid var(--accent);border-radius:999px;padding:.15rem .7rem}
.steps{list-style:none;display:flex;gap:0;margin:.9rem 0 0;padding:0;overflow-x:auto;counter-reset:s}
.steps li{counter-increment:s;flex:1 0 auto;font-size:.8125rem;color:var(--muted);padding:.35rem .9rem .35rem 0;border-top:3px solid var(--line);margin-right:3px;white-space:nowrap}
.steps li::before{content:counter(s) ". "}
.steps li.done{border-top-color:var(--go);color:var(--ink)}
.steps li.now{border-top-color:var(--accent);color:var(--ink);font-weight:600}

.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:.25rem;overflow-x:auto}
.tab{font:600 .9375rem var(--body);color:var(--muted);background:none;border:0;border-bottom:3px solid transparent;padding:.7rem .7rem .55rem;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.badge{display:inline-block;min-width:1.3rem;text-align:center;background:var(--accent);color:#2A1E00;border-radius:999px;font-size:.75rem;padding:0 .35rem;margin-left:.3rem}
main{padding:1.2rem 0 4rem}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:1rem;margin:0 0 .9rem}
.panel > h3{margin-bottom:.35rem}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.spread{justify-content:space-between}
.status{font-size:.8125rem;border-radius:999px;padding:.05rem .6rem;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.status.done,.status.approved,.status.live{background:var(--go-soft);border-color:var(--go);color:var(--ink)}
.status.working,.status.pending{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.status.failed,.status.rejected,.status.blocked{background:var(--stop-soft);border-color:var(--stop);color:var(--ink)}
.out{white-space:pre-wrap;overflow-wrap:anywhere}
.rich ul{margin:.2rem 0 .5rem;padding-left:1.15rem}
.rich li{margin:.15rem 0}
.rich{max-width:44rem}

.btn{font:600 .9375rem var(--body);border-radius:8px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);padding:.55rem .95rem;cursor:pointer}
.btn.quiet{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.go{background:var(--go);border-color:var(--go);color:#fff}
:root[data-theme="dark"] .btn.go{color:#06231D}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.go{color:#06231D}}
.btn.stop{background:transparent;border-color:var(--stop);color:var(--stop)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.tab:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

label{display:block;font-weight:600;font-size:.9375rem;margin:.7rem 0 .2rem}
input,textarea,select{width:100%;font:400 1rem var(--body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:.55rem .65rem}
textarea{min-height:5.5rem;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr;gap:0 .9rem}
@media (min-width:40rem){.grid2{grid-template-columns:1fr 1fr}}
.hint{font-size:.8125rem;color:var(--muted);margin:.15rem 0 0}

.notice{border-left:4px solid var(--accent);background:var(--accent-soft);padding:.6rem .8rem;border-radius:0 8px 8px 0;margin:0 0 .9rem}
.notice.bad{border-left-color:var(--stop);background:var(--stop-soft)}
.notice.good{border-left-color:var(--go);background:var(--go-soft)}

/* the approval slip: the one loud element */
.slip{position:relative;background:var(--surface);border:1px solid var(--line);border-left:12px solid var(--accent);border-radius:4px 14px 14px 4px;padding:1rem 1rem 1rem 1.1rem;margin:0 0 1rem;
  background-image:radial-gradient(circle at 0 50%, var(--paper) 6px, transparent 6.5px);background-size:13px 22px;background-repeat:repeat-y;background-position:right -7px top}
.slip-head{display:flex;justify-content:space-between;gap:.6rem;align-items:baseline;flex-wrap:wrap}
.slip-amount{font:700 2.1rem/1.05 var(--display);margin:.35rem 0 .1rem;letter-spacing:-.02em}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(7.5rem,1fr));gap:.5rem 1rem;margin:.7rem 0}
.facts div{font-size:.9375rem}
.facts span{display:block;font-size:.8125rem;color:var(--muted)}
.slip-actions{display:flex;gap:.6rem;flex-wrap:wrap;align-items:end;margin-top:.8rem;padding-top:.8rem;border-top:1px dashed var(--line)}
.slip-actions .field{flex:1 1 9rem;max-width:13rem}
.slip-actions label{margin:0 0 .2rem;font-size:.8125rem}
.slip.decided{border-left-color:var(--line);background-image:none;padding-top:.7rem;padding-bottom:.7rem}
.slip.decided.approved{border-left-color:var(--go)}
.slip.decided.rejected{border-left-color:var(--stop)}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(8.5rem,1fr));gap:.6rem;margin:0 0 .9rem}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.65rem .8rem}
.tile b{display:block;font:700 1.3rem/1.2 var(--display)}
.tile span{font-size:.8125rem;color:var(--muted)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9375rem}
th,td{text-align:right;padding:.45rem .6rem;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-weight:600;color:var(--muted);font-size:.8125rem}
svg.chart{width:100%;max-width:40rem;height:auto;display:block}
details{margin:.4rem 0}
summary{cursor:pointer;font-weight:600}
.log{list-style:none;margin:.5rem 0 0;padding:0;font-size:.875rem}
.log li{padding:.3rem 0;border-bottom:1px solid var(--line)}
.agent{border-top:1px solid var(--line);padding:.6rem 0}
.agent:first-of-type{border-top:0}
.indent{margin-left:1.1rem;padding-left:.9rem;border-left:2px solid var(--tint)}
.flash{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(1rem + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:.6rem 1rem;border-radius:8px;max-width:calc(100% - 2rem);z-index:9}
@media (prefers-reduced-motion:no-preference){.status.working{animation:pulse 1.4s ease-in-out infinite}@keyframes pulse{50%{opacity:.55}}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="top-row"><h1>Ruchi's Digital Marketing</h1><span class="dry">Dry run: no real money can move</span></div>
  <ol class="steps" id="steps" aria-label="Workflow"></ol>
</div></header>
<nav class="tabs"><div class="wrap" role="tablist" id="tabs"></div></nav>
<main><div class="wrap" id="app"></div></main>
<script>
(() => {
'use strict';
const AGENTS = [{"name": "ceo", "title": "CEO", "boss": null, "dept": "Leadership", "desc": "Makes the final call inside the agency and prepares spend approval requests for you.", "mandate": "Make the final call inside the agent organisation: which strategy and plan go forward and what is recommended to the owner. Own client outcomes. You cannot approve spend; only the owner can.", "playbook": ["Review each department head's work against its quality checklist", "When heads disagree, decide and write down why", "Choose between plan scenarios and state what is given up", "Every number sent to the owner has a source or is labelled an assumption", "Risks and kill criteria must be specific and measurable"], "outputs": ["Decision record", "Spend approval requests", "Three-line status for the owner"]}, {"name": "client-services-director", "title": "Client Services Director", "boss": "ceo", "dept": "Client services", "desc": "Owns brief intake, scope, timeline and client communication. Use first on any new client brief and for client status updates.", "mandate": "Own the client relationship and the brief. Nothing starts without a complete brief, and nothing reaches the client without your review.", "playbook": ["Start from the business outcome the client wants, not their channel wish-list", "Insist on one primary objective and one primary KPI, with a target number and a date", "Pin down what the budget must cover: media only, or also fees, production and tools", "Record mandatories: brand rules, legal constraints, excluded audiences, competitor sensitivities", "Take an inventory of access: ad accounts, analytics, CRM, product feed, historic data", "Restate the brief back in one paragraph and get it confirmed before strategy starts"], "outputs": ["01-brief.md, complete or with every gap listed as a question for the Principal", "Scope and timeline with stage gates (status.md)", "Weekly client status update"]}, {"name": "chief-strategy-officer", "title": "Chief Strategy Officer", "boss": "ceo", "dept": "Strategy", "desc": "Owns audience, proposition, channel roles and the KPI framework. Use after the brief is complete and before media planning.", "mandate": "Turn the client's business problem into a communications strategy: who we need to reach, what we need them to think or do, the job of each channel, and how success will be measured.", "playbook": ["Write the problem as a behaviour to change, with the barrier that currently stops it", "Choose audiences on size, propensity and reachability, and say which you are deliberately not targeting", "Build a KPI tree: business KPI, then campaign KPI, then channel diagnostics. Only one primary KPI", "Give each channel a job (build demand, capture demand, convert, retain) before anyone discusses budget", "Agree with Marketing Science that every KPI in the tree can actually be measured with the access we have", "Keep the strategy to two pages; detail goes in appendices"], "outputs": ["03-strategy.md: business problem, marketing objective, communications objective, audience definition with evidence and size, proposition and message hierarchy, role of each channel across the funnel, KPI tree with targets, hypotheses to test"]}, {"name": "head-of-media-planning", "title": "Head of Media Planning and Investment", "boss": "ceo", "dept": "Media planning and investment", "desc": "Owns channel mix, budget allocation, flighting, forecasts and scenarios. Use once the strategy is signed off, and for any replanning.", "mandate": "Convert the strategy into a media plan in which every unit of budget has an objective, a KPI and a forecast, and the total never exceeds the client ceiling.", "playbook": ["Allocate along response curves and diminishing returns where data exists; otherwise use benchmark ranges and label them as benchmarks", "Respect minimum viable spend per channel so that budget is not spread too thin to learn anything", "Present forecasts as low, base and high, never as a single point", "Account for fees, production and tool costs if the client budget covers them", "Always offer an efficiency-led and a growth-led scenario and explain what each gives up", "Use only open-source planning and modelling tools"], "outputs": ["04-media-plan.md: channel mix with rationale, budget by channel, phase and week, flighting calendar, forecast ranges per channel, at least two scenarios with trade-offs, test budget with hypotheses, assumptions log", "The plan as an open spreadsheet (CSV, Grist or LibreOffice) with traceable formulas"]}, {"name": "head-of-performance", "title": "Head of Performance and Activation", "boss": "ceo", "dept": "Performance and activation", "desc": "Owns campaign build, launch readiness and in-flight optimisation across all paid and owned channels. Use after the plan is approved.", "mandate": "Build what the approved plan describes, get it ready to launch, and optimise it in flight without ever stepping outside what the Principal approved.", "playbook": ["Everything is built paused; only the execution service launches", "One naming convention and one UTM taxonomy, set by Ad Operations, used everywhere", "Budgets, caps and dates in build sheets must equal the approval record exactly", "Give platforms enough time and volume to learn before judging; do not change several things at once", "Review pacing daily and performance weekly; reallocate toward marginal return, not average return"], "outputs": ["05-build/: one build sheet per channel", "Launch-readiness note for QA", "Weekly optimisation log: change, reason, expected effect, review date", "Change requests for anything outside the approved envelope"]}, {"name": "head-of-creative", "title": "Head of Creative and Content", "boss": "ceo", "dept": "Creative and content", "desc": "Owns messaging, creative concepts, asset production and landing experience. Use once the strategy is signed off.", "mandate": "Turn the proposition into creative and landing experiences that fit each placement and can be tested t goes into, and why.", "playbook": ["Set reach and frequency goals before setting budgets", "Check each platform's minimum viable spend and learning requirements", "Flight against seasonality and the purchase cycle; choose continuous or pulsed deliberately", "Sequence demand-building ahead of conversion pushes", "Reserve a test budget and attach a hypothesis and decision rule to each test", "Build the plan in an open spreadsheet with traceable formulas"], "outputs": ["Channel plan table", "Flighting calendar", "Test plan with hypotheses"]}, {"name": "budget-forecasting-analyst", "title": "Budget and Forecasting Analyst", "boss": "head-of-media-planning", "dept": "Media planning and investment", "desc": "Runs media mix modelling, response curves, budget optimisation and forecasts using open-source tools.", "mandate": "Estimate what each unit of budget is likely to return and find the allocation that best meets the objective.", "playbook": ["With roughly two years or more of weekly history, fit a media mix model (Robyn, Meridian or PyMC-Marketing)", "With less history, build response curves from account data or labelled benchmarks and run scenario simulations", "Optimise allocation under constraints with SciPy or OR-Tools", "Report low, base and high cases; state priors and assumptions", "Back-test where possible and run sensitivity analysis on the two most uncertain inputs", "Verify each tool's licence and maintenance status before adopting it"], "outputs": ["Response curves per channel", "Optimised allocation under constraints", "Forecast ranges with assumptions and diagnostics"]}, {"name": "paid-search-specialist", "title": "Paid Search Specialist", "boss": "head-of-performance", "dept": "Performance and activation", "desc": "Plans, builds and optimises paid search and shopping campaigns.", "mandate": "Capture existing demand efficiently and show clearly what brand and non-brand search each deliver.", "playbook": ["Structure by intent (brand, category, competitor, /* ---------- helpers ---------- */
const h = (tag, props, ...kids) => {
  const n = document.createElement(tag);
  if (props) for (const [k, v] of Object.entries(props)) {
    if (v == null || v === false) continue;
    if (k === 'class') n.className = v;
    else if (k === 'text') n.textContent = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else if (k === 'value') n.value = v;
    else n.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat(3)) if (kid != null && kid !== false) n.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return n;
};
const sum = a => a.reduce((x, y) => x + y, 0);
const num = v => { const n = typeof v === 'string' ? parseFloat(v.replace(/[, ]/g, '')) : Number(v); return Number.isFinite(n) ? n : 0; };
const r2 = n => Math.round(n * 100) / 100;
const clip = (s, n) => { s = String(s || ''); return s.length > n ? s.slice(0, n) + ' […]' : s; };
const money = n => { try { return new Intl.NumberFormat(undefined, {style: 'currency', currency: (S.brief && S.brief.currency) || 'INR', maximumFractionDigits: 0}).format(n); } catch (e) { return ((S.brief && S.brief.currency) || '') + ' ' + Math.round(n).toLocaleString(); } };
const int = n => Math.round(n).toLocaleString();
const iso = d => d.toISOString().slice(0, 10);
const addDays = (s, n) => { const d = new Date(s + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return iso(d); };
const flightDays = () => S.brief ? Math.max(1, Math.round((new Date(S.brief.end) - new Date(S.brief.start)) / 864e5) + 1) : 0;
function rnd(seed) { let x = 1779033703 ^ seed.length; for (let i = 0; i < seed.length; i++) { x = Math.imul(x ^ seed.charCodeAt(i), 3432918353); x = x << 13 | x >>> 19; } return () => { x = Math.imul(x ^ (x >>> 16), 2246822507); x = Math.imul(x ^ (x >>> 13), 3266489909); return ((x ^= x >>> 16) >>> 0) / 4294967296; }; }
function rich(text) {
  const box = h('div', {class: 'rich'}); let ul = null;
  const inline = s => s.split(/(\*\*[^*]+\*\*)/).map(p => /^\*\*[^*]+\*\*$/.test(p) ? h('strong', {text: p.slice(2, -2)}) : p);
  for (const raw of String(text || '').split('\n')) {
    const line = raw.trim();
    if (!line) { ul = null; continue; }
    if (/^#{1,4}\s/.test(line)) { ul = null; box.append(h('h4', null, inline(line.replace(/^#+\s*/, '')))); }
    else if (/^[-*•]\s+/.test(line)) { if (!ul) { ul = h('ul'); box.append(ul); } ul.append(h('li', null, inline(line.replace(/^[-*•]\s+/, '')))); }
    else { ul = null; box.append(h('p', null, inline(line))); }
  }
  return box;
}

let saveTimer, saving = false, dirty = false;
function save() { dirty = true; clearTimeout(saveTimer); saveTimer = setTimeout(flush, 600); }
async function flush() {
  if (saving) return; saving = true;
  while (dirty) {
    dirty = false;
    while (JSON.stringify(S).length > 220000) {
      const keys = Object.keys(S.work);
      if (S.reports.length > 2) S.reports.pop(); else if (keys.length) delete S.work[keys[0]]; else if (S.audit.length > 20) S.audit.length = 20; else break;
    }
    const payload = JSON.stringify(S);
    try { if (caps.doc) await caps.doc.set({state: payload, at: Date.now()}); else localStorage.setItem(LS, payload); caps.saveFailed = false; }
    catch (e) { caps.saveFailed = true; }

}

/* ---------- gate and ledger (enforced here, in code) ---------- */
const pending = () => S.requests.filter(r => r.status === 'PENDING');
const approvedTotal = () => sum(S.requests.filter(r => r.status === 'APPROVED').map(r => r.approved_amount));
const committed = () => sum(S.campaigns.map(c => c.budget));
const spentOf = ch => sum(S.days.filter(d => !ch || d.ch === ch).map(d => d.s));
const camp = ch => S.campaigns.find(c => c.channel === ch);
function addRequest(r) {
  S.seq++; const id = 'SAR-' + String(S.seq).padStart(4, '0');
  S.requests.push(Object.assign({id, status: 'PENDING', approved_amount: 0, executed: false, at: new Date().toISOString()}, r));
  log('CEO', `${id} raised: ${r.kind === 'increase' ? 'increase' : 'launch'} ${r.channel}, ${money(r.amount)}`);
  return id;
}
function decide(id, verdict, amount) {
  const r = S.requests.find(x => x.id === id);
  if (!r || r.status !== 'PENDING') return;
  if (verdict === 'APPROVED') {
    const amt = r2(amount);
    if (!(amt > 0)) return flash('Enter an amount above zero.');
    if (approvedTotal() + amt > S.brief.ceiling + 0.005) return flash(`Not approved: this would take approved spend past the client ceiling of ${money(S.brief.ceiling)}.`);
    if (amt < r.amount) r.daily_cap = Math.max(1, Math.ceil(r.daily_cap * amt / r.amount));
    r.approved_amount = amt;
    log('You', `${id} approved${amt !== r.amount ? ' with a changed amount' : ''}: ${money(amt)}`);
  } else log('You', `${id} rejected`);
  r.status = verdict; r.decided_at = new Date().toISOString();
  save(); render();
}
function authorize(a) {
  if (a.type === 'pause' || a.type === 'decrease') return null;               // always allowed
  if (a.type !== 'launch' && a.type !== 'increase' && a.type !== 'resume') return 'Unknown action type; refused by default.';
  const r = S.requests.find(x => x.id === a.request_id);
  if (!r) return 'No approval record for this action.';
  if (r.status !== 'APPROVED') return `${r.id} is ${r.status.toLowerCase()}, not approved.`;
  if (r.channel !== a.channel) return `${r.id} covers ${r.channel}, not ${a.channel}.`;
  if (a.type === 'resume') return null;                                         // same approval, same budget
  if (r.executed) return `${r.id} has already been used.`;
  if (a.amount > r.approved_amount + 0.005) return `${money(a.amount)} is more than the ${money(r.approved_amount)} approved under ${r.id}.`;
  if (a.type === 'launch' && camp(a.channel)) return `${a.channel} is already running.`;
  if (a.type === 'increase' && !camp(a.channel)) return `${a.channel} has not been launched.`;
  if (committed() + a.amount > S.brief.ceiling + 0.005) return 'This would commit more than the client ceiling.';
  return null;
}
function execute(a, actor) {
  const blocked = authorize(a);
  if (blocked) { log('Execution service', `Blocked ${a.type} ${a.channel || ''}: ${blocked}`); return blocked; }
  const c = camp(a.channel);
  if (a.type === 'launch') {
    const r = S.requests.find(x => x.id === a.request_id), k = r.approved_amount / r.amount;
    S.campaigns.push({channel: a.channel, request_id: r.id, budget: r.approved_amount, daily: r.daily_cap, status: 'live', cpm: r.cpm, ctr: r.ctr,
      planCpa: r.expected && r.expected[1] > 0 ? r.amount / r.expected[1] : 0, planBase: r.expected ? r.expected[1] * k : 0, eff: 0.7 + 0.55 * rnd(S.seed + a.channel)()});
    r.executed = true;
  } else if (a.type === 'increase') { const r = S.requests.find(x => x.id === a.request_id); c.budget = r2(c.budget + r.approved_amount); c.daily = Math.max(c.daily, r.daily_cap); if (c.status === 'ended') c.status = 'live'; r.executed = true; }
  else if (a.type === 'pause') { if (c) c.status = 'paused'; }
  else if (a.type === 'resume') { if (c) c.status = 'live'; }
  else if (a.type === 'decrease') { if (c) c.budget = Math.max(r2(spentOf(c.channel)), Math.min(c.budget, r2(a.amount))); }

}
function deploy() {
  let n = 0;
  for (const r of S.requests.filter(r => r.status === 'APPROVED' && !r.executed)) if (!execute({type: r.kind, request_id: r.id, channel: r.channel, amount: r.approved_amount})) n++;
  save(); if (n) { tab = 'dashboard'; flash(`${n} approved ${n === 1 ? 'item' : 'items'} launched on the simulated ad platform.`); } render();
}

/* ---------- simulated ad platform ---------- */
function advanceDay() {
  const total = flightDays();
  if (S.day >= total || !S.campaigns.some(c => c.status === 'live')) return false;
  const d = S.day;
  for (const c of S.campaigns) {
    if (c.status !== 'live') continue;
    const r = rnd(S.seed + '|' + c.channel + '|' + d), remaining = c.budget - spentOf(c.channel);
    if (remaining <= 0.5) { c.status = 'ended'; log('Execution service', `${c.channel} stopped: approved budget fully spent`); continue; }
    const target = Math.min(c.daily, remaining / (total - d));
    const spend = r2(Math.min(remaining, c.daily, target * (0.86 + 0.2 * r())));
    const imp = c.cpm > 0 ? spend / c.cpm * 1000 * (0.9 + 0.2 * r()) : 0;
    const clk = imp * (c.ctr > 0 ? c.ctr : 1) / 100 * (0.85 + 0.3 * r());
    const cf = c.planCpa > 0 ? spend / c.planCpa * c.eff * (0.7 + 0.6 * r()) : 0;
    S.days.push({d, ch: c.channel, s: spend, i: Math.round(imp), k: Math.round(clk), c: Math.floor(cf) + (r() < cf % 1 ? 1 : 0)});
  }
  S.day++; return true;
}
function totals(ch) { const rows = S.days.filter(d => !ch || d.ch === ch); return {s: sum(rows.map(d => d.s)), i: sum(rows.map(d => d.i)), k: sum(rows.map(d => d.k)), c: sum(rows.map(d => d.c))}; }
function alerts() {
  const out = [], total = flightDays();
  if (S.day > 0 && S.campaigns.length) {
    const plan = committed() / total * S.day, act = spentOf();
    if (plan > 0 && Math.abs(act - plan) / plan > 0.1) out.push({text: `Spend is ${Math.round(Math.abs(act - plan) / plan * 100)}% ${act > plan ? 'ahead of' : 'behind'} plan for this point in the flight.`});
    for (const c of S.campaigns) {
      const t = totals(c.channel), days = S.days.filter(d => d.ch === c.channel).length;
      if (c.status === 'live' && days >= 3 && c.planCpa > 0 && (t.c === 0 || t.s / t.c > 1.5 * c.planCpa)) out.push({text: `${c.channel}: cost per ${S.brief.kpi} is ${t.c ? money(t.s / t.c) : 'not measurable yet'}, against a planned ${money(c.planCpa)}.`, pause: c.channel});
      if (c.status === 'ended') out.push({text: `${c.channel} has spent its full approved budget and stopped.`});
    }
  }
  return out;
}
